name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tabla ARGENFOOD
        continue-on-error: true
        run: |
          pip install --quiet pdfplumber requests
          mkdir -p app/src/main/assets
          python tools/argenfood.py app/src/main/assets/argenfood.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests y APK debug
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mtracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decodificar clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Compilar APK firmado
        if: env.KEYSTORE_BASE64 != ''
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: mtracker
          path: app/build/outputs/apk/release/app-release.apk
